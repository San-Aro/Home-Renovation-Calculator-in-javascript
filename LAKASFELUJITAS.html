<html lang="hu">

    <link rel="stylesheet" href="style.css">
    <title>Lakásfelujítás</title>
</head>
<body>

        <label for="magassag">Magasság (méter)</label><br>

        <label for="ajtok_szama">Ajtók száma</label><br>
        <input id="ajtok_szama" type="number"><br>

        <label for="ablakok_szama">Ablakok száma</label><br>
        <input id="ablakok_szama" type="number"><br>
        <button type="submit">Számolás</button>
    </form>

    <div id="eredmeny"></div>

</html>
